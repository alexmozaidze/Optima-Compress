[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Backend and renderer are pinned rather than inherited from slint's defaults, so Qt can never
# enter the build. Mirrors slint's default set with backend-winit in place of backend-default.
# NOTE: winit-only, with three renderers picked in Slint's documented order: Skia, then FemtoVG,
# then software. Skia comes first because slint-viewer renders this UI with Skia and FemtoVG's text
# rasteriser makes the same markup look softer. Do not add another backend: Slint tries Qt before
# winit, and the Qt renderer is QPainter, software-only.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    # NOTE: the winit backend ignores file drops, so the host hooks DroppedFile through
    # WinitWindowAccessor::on_winit_window_event and needs the winit re-exports.
    "unstable-winit-030",
    "renderer-skia",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
# Text-only clipboard for the per-row Copy action. The default features pull image support the
# app never uses; wayland-data-control covers the compositor the app runs under.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
gstreamer = "0.25"
gstreamer-pbutils = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# NOTE: winit 0.30 has no Wayland file-drop backend, so this speaks wl_data_device on the window's
# own connection. It returns None on X11, where winit's own drop events already work.
limn-dnd = "0.1"
# The file chooser goes through the XDG desktop portal; ashpd/zbus are hidden behind this feature.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Windows and macOS use their native file chooser.
rfd = "0.15"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[features]
# Test-only: seeds clips in the Rust host for the UI regressions.
demo-clips = []

[profile.dev]
# The UI is interactive; the generated markup code stays cheap to rebuild.
opt-level = 1
# Line tables only: keeps breakpoints and file:line, cuts link time, startup and binary size.
debug = 1

[profile.dev.package."*"]
# Slint's runtime, renderer and font stack do the per-frame work.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
